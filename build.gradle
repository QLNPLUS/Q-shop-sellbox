plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge-26.1.2" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server() }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' }
}

// 可选：把本地 jar 目录当作依赖来源（开发用；CI 不设置该属性）
def localModsDir = findProperty('local_mods_dir') ? file(findProperty('local_mods_dir').toString()) : null
def localMod = { String pattern ->
    localModsDir != null && localModsDir.exists() ? fileTree(localModsDir).matching { include pattern }.files : []
}
def addOptionalMod = { String configuration, String notation, String pattern ->
    def files = localMod(pattern)
    dependencies.add(configuration, files ? project.files(files) : notation)
}

// QShop 依赖 jar：路径来自 gradle.properties 的 qshop_jar，可用 -Pqshop_jar=<path> 覆盖。
// 缺失时立即失败并给出可操作提示，不要退化成"一堆类找不到"的编译错误。
def qshopJarFile = file(findProperty('qshop_jar') ?:
        '../../q_shop/neoforge-1.26.1.2/build/libs/qshop-neoforge-26.1.2-1.7.1.jar')
if (!qshopJarFile.isFile()) {
    throw new GradleException("未找到 QShop 依赖 jar: ${qshopJarFile}\n" +
            "请先构建 QShop（D:\\projects\\q_shop\\neoforge-1.26.1.2），或用 -Pqshop_jar=<path> 指定。")
}

dependencies {
    compileOnly files(qshopJarFile)
    addOptionalMod('compileOnly', "dev.latvian.mods:kubejs-neoforge:${kubejs_version}", 'kubejs-neoforge-*.jar')
    addOptionalMod('compileOnly', 'dev.latvian.mods:rhino:2101.2.7-build.85', 'rhino-*.jar')
}

configurations {
    testCompileOnly.extendsFrom compileOnly
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('smokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.test.compileClasspath
    mainClass = 'com.qshop.sellbox.kubejs.SellBoxNbtSmokeTest'
}

// 本项目的 test 源集是 smokeTest 用的 main() 程序，没有 JUnit 用例；
// Gradle 9 默认会因为"有测试源但发现不了测试"而失败，这里显式关掉。
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

processResources {
    def replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            kubejs_version         : kubejs_version,
            loader_version_range   : loader_version_range,
            neo_version_range      : neo_version_range,
            minecraft_version_range: minecraft_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
