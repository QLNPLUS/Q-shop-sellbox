plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'com.qshop'
version = '1.6.0'
base { archivesName = 'qshop-sellbox-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // KubeJS mixins use SRG targets while the Forge dev runtime uses official names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                qshop_sellbox { source sourceSets.main }
            }
        }
        client {}
        server {}
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.fabricmc.net/' }
}

// QShop 依赖 jar：路径来自 gradle.properties 的 qshop_jar，可用 -Pqshop_jar=<path> 覆盖。
// 缺失时立即失败并给出可操作提示，不要退化成"一堆类找不到"的编译错误。
def qshopJarFile = file(findProperty('qshop_jar') ?:
        '../../q_shop/forge-1.20.1/build/libs/qshop-forge-1.20.1-1.7.0.jar')
if (!qshopJarFile.isFile()) {
    throw new GradleException("未找到 QShop 依赖 jar: ${qshopJarFile}\n" +
            "请先构建 QShop（D:\\projects\\q_shop\\forge-1.20.1），或用 -Pqshop_jar=<path> 指定。")
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    compileOnly fg.deobf(files(qshopJarFile))

    // Optional at runtime. The plugin is discovered only when KubeJS is installed.
    compileOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.14')
    compileOnly fg.deobf('dev.latvian.mods:rhino:2001.2.2-build.18')
    runtimeOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.14')
    runtimeOnly fg.deobf('dev.latvian.mods:rhino:2001.2.2-build.18')
    runtimeOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.18')
    runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    runtimeOnly fg.deobf('net.fabricmc:fabric-loader:0.14.21')
    runtimeOnly fg.deobf('net.fabricmc:intermediary:1.20.1')
}

configurations {
    testCompileOnly.extendsFrom compileOnly
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

tasks.register('smokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.qshop.sellbox.kubejs.SellBoxNbtSmokeTest'
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'qshop_sellbox',
                'Specification-Vendor': 'qshop',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
}
