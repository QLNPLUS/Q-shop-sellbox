name: Publish QShop Sell Box

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string
      forge_ref:
        description: Forge branch or tag to build
        required: false
        default: forge-1.20.1
        type: string
      neoforge_ref:
        description: NeoForge branch or tag to build
        required: false
        default: neoforge-1.21.1
        type: string
      neoforge_126_ref:
        description: NeoForge 26.1.2 branch or tag to build
        required: false
        default: neoforge-1.26.1.2
        type: string
      loader:
        description: Platform to publish for a manual run
        required: false
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge
          - neoforge-126

permissions:
  contents: write

concurrency:
  group: curseforge-sellbox-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  NEOFORGE_REF: ${{ inputs.neoforge_ref || 'neoforge-1.21.1' }}
  NEOFORGE_126_REF: ${{ inputs.neoforge_126_ref || 'neoforge-1.26.1.2' }}

jobs:
  publish-forge:
    needs: publish-neoforge
    if: ${{ always() && (github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'forge') && (needs.publish-neoforge.result == 'success' || needs.publish-neoforge.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sell Box Forge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.forge_ref || inputs.tag || github.ref }}
          path: sellbox-forge-1.20.1

      - name: Check out QShop Forge dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: master
          path: Q-shop

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop/gradle.properties \
            sellbox-forge-1.20.1/gradle.properties

      - name: Prepare CurseForge version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop Forge dependency
        run: |
          chmod +x Q-shop/gradlew
          (cd Q-shop && ./gradlew build --no-daemon)

      - name: Build Sell Box Forge mod
        run: |
          QSHOP_JAR="$(ls Q-shop/build/libs/qshop-forge-1.20.1-*.jar | grep -v sources | head -1)"
          test -f "$QSHOP_JAR" || { echo "QShop Forge jar not found under Q-shop/build/libs"; exit 1; }
          chmod +x sellbox-forge-1.20.1/gradlew
          (cd sellbox-forge-1.20.1 && ./gradlew build --no-daemon -Pqshop_jar="../$QSHOP_JAR")

      - name: Prepare current Forge changelog
        working-directory: sellbox-forge-1.20.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Sell Box Forge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: sellbox-forge-1.20.1/build/libs/qshop-sellbox-forge-1.20.1-*.jar
          version: ${{ env.CURSEFORGE_VERSION }}
          name: QShop Sell Box ${{ env.CURSEFORGE_VERSION }} Forge 1.20.1
          version-type: release
          changelog-file: sellbox-forge-1.20.1/build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

  publish-neoforge:
    if: ${{ github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'neoforge' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sell Box NeoForge source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOFORGE_REF }}
          path: sellbox-neoforge-1.21.1

      - name: Check out QShop NeoForge dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: neoforge-1.21.1
          path: Q-shop-neoforge-1.21.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop-neoforge-1.21.1/gradle.properties \
            sellbox-neoforge-1.21.1/gradle.properties

      - name: Prepare CurseForge version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop NeoForge dependency
        run: |
          chmod +x Q-shop-neoforge-1.21.1/gradlew
          (cd Q-shop-neoforge-1.21.1 && ./gradlew build --no-daemon)

      - name: Build Sell Box NeoForge mod
        run: |
          QSHOP_JAR="$(ls Q-shop-neoforge-1.21.1/build/libs/qshop-neoforge-1.21.1-*.jar | grep -v sources | head -1)"
          test -f "$QSHOP_JAR" || { echo "QShop NeoForge jar not found under Q-shop-neoforge-1.21.1/build/libs"; exit 1; }
          chmod +x sellbox-neoforge-1.21.1/gradlew
          (cd sellbox-neoforge-1.21.1 && ./gradlew build --no-daemon -Pqshop_jar="../$QSHOP_JAR")

      - name: Prepare current NeoForge changelog
        working-directory: sellbox-neoforge-1.21.1
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Sell Box NeoForge mod file
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: sellbox-neoforge-1.21.1/build/libs/qshop_sellbox-neoforge-1.21.1-*.jar
          version: ${{ env.CURSEFORGE_VERSION }}
          name: QShop Sell Box ${{ env.CURSEFORGE_VERSION }} NeoForge 1.21.1
          version-type: release
          changelog-file: sellbox-neoforge-1.21.1/build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21

  publish-neoforge-126:
    if: ${{ github.event_name == 'release' || inputs.loader == 'all' || inputs.loader == 'neoforge-126' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Sell Box NeoForge 26.1.2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEOFORGE_126_REF }}
          path: sellbox-neoforge-1.26.1.2

      - name: Check out QShop NeoForge 26.1.2 dependency
        uses: actions/checkout@v4
        with:
          repository: QLNPLUS/Q-shop
          ref: neoforge-1.26.1.2
          path: Q-shop-neoforge-1.26.1.2

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local build settings
        run: |
          sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' \
            Q-shop-neoforge-1.26.1.2/gradle.properties \
            sellbox-neoforge-1.26.1.2/gradle.properties

      - name: Prepare CurseForge version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: echo "CURSEFORGE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || {
            echo "Missing repository variable CURSEFORGE_PROJECT_ID"
            exit 1
          }
          test -n "$CURSEFORGE_TOKEN" || {
            echo "Missing repository secret CURSEFORGE_TOKEN"
            exit 1
          }

      - name: Build QShop NeoForge 26.1.2 dependency
        run: |
          chmod +x Q-shop-neoforge-1.26.1.2/gradlew
          (cd Q-shop-neoforge-1.26.1.2 && ./gradlew build --no-daemon)

      - name: Build Sell Box NeoForge 26.1.2 mod
        run: |
          QSHOP_JAR="$(ls Q-shop-neoforge-1.26.1.2/build/libs/qshop-neoforge-26.1.2-*.jar | grep -v sources | head -1)"
          test -f "$QSHOP_JAR" || { echo "QShop NeoForge 26.1.2 jar not found under Q-shop-neoforge-1.26.1.2/build/libs"; exit 1; }
          chmod +x sellbox-neoforge-1.26.1.2/gradlew
          (cd sellbox-neoforge-1.26.1.2 && ./gradlew build --no-daemon -Pqshop_jar="../$QSHOP_JAR")

      - name: Prepare current NeoForge 26.1.2 changelog
        working-directory: sellbox-neoforge-1.26.1.2
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          version="${RELEASE_VERSION#v}"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)
              if (found && heading != version) exit
              if (heading == version) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md || {
            echo "Missing CHANGELOG.md section for version $version"
            exit 1
          }

      - name: Publish Sell Box NeoForge 26.1.2 mod file
        uses: Kira-NT/mc-publish@v3
        with:
