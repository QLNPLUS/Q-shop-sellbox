          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_VERSION }}
          files: sellbox-neoforge-1.26.1.2/build/libs/qshop_sellbox-neoforge-26.1.2-*.jar
          version: ${{ env.CURSEFORGE_VERSION }}
          name: QShop Sell Box ${{ env.CURSEFORGE_VERSION }} NeoForge 26.1.2
          version-type: release
          changelog-file: sellbox-neoforge-1.26.1.2/build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 26.1.2
          java: 25
